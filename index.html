<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Maestro - Aprendizaje Progresivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .header {
            background: rgba(10, 10, 10, 0.98);
            border-bottom: 4px solid #ff0033;
        }
        .card {
            background: #111111;
            border: 1px solid #444;
        }
        .code-editor {
            background: #000;
            color: #67e8f9;
            border: 2px solid #ff0033;
            font-family: monospace;
            resize: vertical;
        }
        .output {
            background: #0a0a0a;
            border: 2px solid #c026d3;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="header py-6 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <span class="text-5xl">🐍</span>
            <div>
                <h1 class="text-4xl font-black text-red-500">PYTHON MAESTRO</h1>
                <p class="text-red-400 mono text-sm">Aprendizaje Progresivo desde Principiante</p>
            </div>
        </div>
    </div>
</div>

<div class="max-w-6xl mx-auto px-6 py-10">
    <div class="flex border-b border-gray-700 mb-10">
        <button onclick="switchLevel(0)" class="level-tab active px-8 py-4 text-lg">01 Principiante</button>
        <button onclick="switchLevel(1)" class="level-tab px-8 py-4 text-lg">02 Intermedio</button>
        <button onclick="switchLevel(2)" class="level-tab px-8 py-4 text-lg">03 F-Strings Avanzado</button>
    </div>

    <div id="content"></div>
</div>

<script>
// ===================== PYODIDE =====================
let pyodideInstance = null;

async function initPyodide() {
    if (pyodideInstance) return pyodideInstance;
    pyodideInstance = await loadPyodide({
        indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.3/full/"
    });
    return pyodideInstance;
}

async function runPython(code, outputId) {
    const output = document.getElementById(outputId);
    output.textContent = "Ejecutando...";
    try {
        const py = await initPyodide();
        const result = py.runPython(code);
        output.textContent = result !== undefined ? result : "Ejecutado correctamente";
    } catch (err) {
        output.textContent = "Error: " + err.message;
    }
}

// ===================== CAMBIO DE NIVEL =====================
function switchLevel(level) {
    const content = document.getElementById('content');
    
    if (level === 0) {
        content.innerHTML = `
            <div class="card p-8 rounded-2xl max-w-2xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-red-400">Nivel 1 - Principiante</h2>
                <textarea id="code1" class="code-editor w-full h-52 p-4 rounded-xl">nombre = "Ana"
edad = 25
print(f"Hola, soy {nombre} y tengo {edad} años.")</textarea>
                <button onclick="runPython(document.getElementById('code1').value, 'out1')" 
                        class="mt-4 w-full py-3 bg-red-600 rounded-xl font-medium">Ejecutar</button>
                <div id="out1" class="output mt-6 p-6 rounded-xl min-h-[100px]"></div>
            </div>
        `;
    } 
    else if (level === 2) {
        content.innerHTML = `
            <div class="card p-8 rounded-2xl">
                <h2 class="text-2xl font-bold mb-6 text-purple-400">Nivel 3 - F-Strings Avanzadas</h2>
                <textarea id="code2" class="code-editor w-full h-96 p-4 rounded-xl" placeholder="Escribe tu código con f-strings aquí..."></textarea>
                <div class="flex gap-4 mt-6">
                    <button onclick="loadExample()" 
                            class="flex-1 py-4 bg-zinc-700 hover:bg-zinc-600 rounded-xl">Cargar Ejemplo de Ticket</button>
                    <button onclick="runPython(document.getElementById('code2').value, 'out2')" 
                            class="flex-1 py-4 bg-red-600 hover:bg-red-700 rounded-xl font-bold">Ejecutar Reporte</button>
                </div>
                <div id="out2" class="output mt-8 p-8 rounded-xl min-h-[340px]"></div>
            </div>
        `;
    }
}

function loadExample() {
    const example = `print("=" * 70)
print(f"{'TICKET DE VENTA':^70}")
print("=" * 70)
print(f"{'Producto':<35} {'Cant':>6} {'Precio':>14} {'Subtotal':>14}")
print("-" * 70)

productos = [
    ("Laptop Dell", 1299.99, 2),
    ("Mouse Logitech", 45.50, 5),
    ("Teclado Mecánico", 89.99, 3)
]

total = 0
for nombre, precio, cant in productos:
    subtotal = precio * cant
    total += subtotal
    print(f"{nombre:<35} {cant:>6} ${precio:>13.2f} ${subtotal:>13.2f}")

print("-" * 70)
print(f"{'TOTAL A PAGAR':<57} ${total:>13.2f}")
print("=" * 70)`;

    document.getElementById('code2').value = example;
    runPython(example, 'out2');
}

// Iniciar
window.onload = () => {
    switchLevel(0);
};
</script>
</body>
</html>
